<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Currie Star 2017 Yellows</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef5ff;
color:#222;
}

header{
background:#0057b8;
color:white;
padding:30px;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
}

.stat{
background:#0057b8;
color:white;
padding:15px;
border-radius:10px;
text-align:center;
}

.stat h2{
margin:0;
}

select{
padding:10px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0057b8;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.formGuide{
font-size:32px;
}

.scorers{
font-size:20px;
line-height:1.8;
}

</style>
</head>

<body>

<header>
<h1>⚽ Currie Star 2017 Yellows</h1>
<p>Club Statistics Dashboard</p>
</header>

<div class="container">

<div class="card">

<label><strong>Season</strong></label>

<br><br>

<select id="seasonSelect">

<option>1 - Beckham</option>
<option selected>2 - Zidane</option>

</select>

</div>

<div class="card">

<h2>📊 Season Summary</h2>

<div
class="stats"
id="summary">
</div>

</div>

<div class="card">

<h2>🏆 Top 3 Scorers</h2>

<div
id="topScorers"
class="scorers">
</div>

</div>

<div class="card">

<h2>🔥 Form Guide</h2>

<div
id="formGuide"
class="formGuide">
</div>

</div>

<div class="card">

<h2>📅 Match History</h2>

<div id="matches"></div>

</div>

<div class="card">

<h2>👥 Player Statistics</h2>

<div id="playerStats"></div>

</div>

</div>

<script>

const players = [

"Jamie",
"Sam",
"Francesco",
"Thomas",
"Freddy",
"Magnus",
"Oliver",
"Finn",
"Mohammad",
"Luke",
"Brodie"

];

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRFC3rT4TgF0dD4eNEaDrwjOtGlN8H9na1ONDicw_un_K5Q_fzi22TK7dFKKnKWJTrsqO6HXwYcpx79/pub?output=csv";

let matches = [];

fetch(csvUrl)

.then(response => response.text())

.then(text => {

const rows =
text.trim().split("\n");

const headers =
rows[0].split(",");

matches =
rows.slice(1).map(row => {

const values =
row.split(",");

let obj = {};

headers.forEach((h,i)=>{

obj[h.trim()] =
values[i]
? values[i].trim()
: "";

});

return obj;

});

render();

});

function render(){

const season =
document
.getElementById(
"seasonSelect"
).value;

const data =
matches.filter(
m => m["Season"] === season
);

let wins = 0;
let draws = 0;
let losses = 0;

let gf = 0;
let ga = 0;

let form = "";

const playerApps = {};
const playerGoals = {};

players.forEach(player=>{

playerApps[player]=0;
playerGoals[player]=0;

});

data.forEach(match=>{

gf += Number(
match["Goals For"]
|| 0
);

ga += Number(
match["Goals Against"]
|| 0
);

if(match["Result"]==="Win"){

wins++;
form += "🟢 ";

}
else if(match["Result"]==="Draw"){

draws++;
form += "🟡 ";

}
else if(match["Result"]==="Loss"){

losses++;
form += "🔴 ";

}

players.forEach(player=>{

if(
match[player+" Appearance"]
==="Y"
){
playerApps[player]++;
}

playerGoals[player] +=
Number(
match[player+" Goals"]
|| 0
);

});

});

document.getElementById(
"summary"
).innerHTML = `

<div class="stat">
<h2>${data.length}</h2>
Games
</div>

<div class="stat">
<h2>${wins}</h2>
Wins
</div>

<div class="stat">
<h2>${draws}</h2>
Draws
</div>

<div class="stat">
<h2>${losses}</h2>
Losses
</div>

<div class="stat">
<h2>${gf}</h2>
GF
</div>

<div class="stat">
<h2>${ga}</h2>
GA
</div>

<div class="stat">
<h2>${gf-ga}</h2>
GD
</div>

`;

document.getElementById(
"formGuide"
).innerHTML =
form;

const top3 =
Object.entries(playerGoals)
.sort((a,b)=>b[1]-a[1])
.slice(0,3);

document.getElementById(
"topScorers"
).innerHTML = `

🥇 ${top3[0][0]} (${top3[0][1]})<br>

🥈 ${top3[1][0]} (${top3[1][1]})<br>

🥉 ${top3[2][0]} (${top3[2][1]})

`;

let matchHTML = `

<table>

<tr>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Score</th>
<th>Result</th>
<th>Captain</th>
<th>Goalscorers</th>
</tr>

`;

data
.slice()
.reverse()
.forEach(match=>{

let scorers = [];

players.forEach(player=>{

const goals =
Number(
match[player+" Goals"]
|| 0
);

if(goals > 0){

if(goals === 1){

scorers.push(player);

}else{

scorers.push(
player + " x" + goals
);

}

}

});

matchHTML += `

<tr>

<td>${match["Date"]}</td>

<td>${match["Opposition"]}</td>

<td>${match["Venue"]}</td>

<td>
${match["Goals For"]}-
${match["Goals Against"]}
</td>

<td>${match["Result"]}</td>

<td>${match["Captain"]}</td>

<td>${scorers.join(", ")}</td>

</tr>

`;

});

matchHTML += "</table>";

document.getElementById(
"matches"
).innerHTML =
matchHTML;

let playerHTML = `

<table>

<tr>
<th>Player</th>
<th>Apps</th>
<th>Goals</th>
</tr>

`;

players
.map(player=>({

name:player,

apps:
playerApps[player],

goals:
playerGoals[player]

}))

.sort((a,b)=>
b.apps-a.apps
)

.forEach(player=>{

playerHTML += `

<tr>

<td>${player.name}</td>

<td>${player.apps}</td>

<td>${player.goals}</td>

</tr>

`;

});

playerHTML +=
"</table>";

document.getElementById(
"playerStats"
).innerHTML =
playerHTML;

}

document
.getElementById(
"seasonSelect"
)
.addEventListener(
"change",
render
);

</script>

</body>
</html>
